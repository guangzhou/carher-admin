# Example only. Copy the live nginx configuration into a root-only file,
# preserve every unrelated server/upstream, then add the markers:
#   - the HTTP marker          exactly once, inside http {}
#   - the product proxy marker once per /pro location that can reach the
#     upstream (198 on 2026-09-13: 7 of them), except redirect-only locations,
#     which must NOT carry it — see README.md step 2.
# (The marker strings themselves are not spelled out in this comment: the
#  renderer fails closed on any leftover marker text in its output.)
http {
    upstream litellm_product { server 127.0.0.1:30402; keepalive 32; }

    # @@LITELLM_GRAY_HTTP_DIRECTIVES@@

    server {
        listen 443 ssl;

        # Redirect-only: unconditional `return 30x`, no proxy_pass, no nested
        # block. Exempt from the marker requirement, and REJECTED if it carries
        # one — its instant 301s would enter the gray metric sample and bias
        # the gate toward false green.
        location = /pro { return 301 /pro/; }

        location ^~ /pro/ui/ {
            rewrite ^/pro/(.*)$ /$1 break;
            # @@LITELLM_GRAY_PRODUCT_PROXY_DIRECTIVES@@
        }

        location /pro/ {
            rewrite ^/pro/(.*)$ /$1 break;
            # @@LITELLM_GRAY_PRODUCT_PROXY_DIRECTIVES@@
        }
    }
}
