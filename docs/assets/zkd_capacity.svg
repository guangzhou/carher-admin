<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620">
  <defs>
    <linearGradient id="safeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa76d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3aa76d" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="dangerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d94b4b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d94b4b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="measuredFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b7dd8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b7dd8" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2536" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1020" height="620" fill="#fbfcfe"/>

  <text x="40" y="42" font-size="23" font-weight="700" fill="#1b2536">单副本还能扛多久：内存要按「边际」量，不能按「总倍率」量</text>
  <text x="40" y="68" font-size="14" fill="#5d6b83">zk-delta/tests/capacity_probe.js 本地实测（2026-08-31，纯本地灌数据，一发不打上游）</text>

  <!-- 危险区（超 2Gi limit） -->
  <rect x="90" y="60" width="850" height="89" fill="url(#dangerFill)"/>
  <!-- 安全区 -->
  <rect x="90" y="149" width="850" height="331" fill="url(#safeFill)"/>

  <!-- 网格 -->
  <g stroke="#dfe5ee" stroke-width="1">
    <line x1="90" y1="399" x2="940" y2="399"/>
    <line x1="90" y1="318" x2="940" y2="318"/>
    <line x1="90" y1="238" x2="940" y2="238"/>
    <line x1="90" y1="157" x2="940" y2="157"/>
    <line x1="90" y1="76"  x2="940" y2="76"/>
    <line x1="269" y1="60" x2="269" y2="480"/>
    <line x1="627" y1="60" x2="627" y2="480"/>
    <line x1="806" y1="60" x2="806" y2="480"/>
  </g>

  <!-- 实测区间（0–277MB） -->
  <rect x="90" y="60" width="124" height="420" fill="url(#measuredFill)"/>
  <text x="96" y="474" font-size="12" fill="#3b7dd8" font-weight="600">实测区间 0–277MB</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="480" x2="950" y2="480" stroke="#8a97ad" stroke-width="2"/>
  <line x1="90" y1="52"  x2="90"  y2="480" stroke="#8a97ad" stroke-width="2"/>
  <polygon points="950,480 941,475 941,485" fill="#8a97ad"/>
  <polygon points="90,52 85,61 95,61" fill="#8a97ad"/>

  <g font-size="12" fill="#6b7789">
    <text x="84" y="498" text-anchor="middle">0</text>
    <text x="269" y="498" text-anchor="middle">400</text>
    <text x="448" y="498" text-anchor="middle">800</text>
    <text x="627" y="498" text-anchor="middle">1200</text>
    <text x="806" y="498" text-anchor="middle">1600</text>
    <text x="80" y="484" text-anchor="end">0</text>
    <text x="80" y="403" text-anchor="end">500</text>
    <text x="80" y="322" text-anchor="end">1000</text>
    <text x="80" y="242" text-anchor="end">1500</text>
    <text x="80" y="161" text-anchor="end">2000</text>
    <text x="80" y="80"  text-anchor="end">2500</text>
  </g>
  <text x="515" y="519" font-size="13" fill="#4a5668" text-anchor="middle" font-weight="600">会话状态 store（MB）</text>
  <text x="30" y="270" font-size="13" fill="#4a5668" text-anchor="middle" font-weight="600" transform="rotate(-90 30 270)">进程 RSS（MB）</text>

  <!-- 2Gi limit -->
  <line x1="90" y1="149" x2="940" y2="149" stroke="#d94b4b" stroke-width="2.5" stroke-dasharray="9 5"/>
  <text x="936" y="142" font-size="13" fill="#d94b4b" font-weight="700" text-anchor="end">容器 memory limit 2048MB —— 越线 = OOMKill</text>

  <!-- 被推翻的判法：总倍率 20x（只画到副标题下方，避免压字） -->
  <line x1="90" y1="480" x2="146" y2="94" stroke="#c2410c" stroke-width="2" stroke-dasharray="3 4" opacity="0.75"/>
  <circle cx="146" cy="94" r="4" fill="#c2410c" opacity="0.75"/>

  <!-- 最小二乘拟合 1.13x -->
  <line x1="90" y1="452" x2="940" y2="105" stroke="#3b7dd8" stroke-width="3"/>
  <!-- 保守边际 1.24x -->
  <line x1="90" y1="452" x2="940" y2="71" stroke="#2f5fa8" stroke-width="2.5" stroke-dasharray="7 4"/>

  <!-- base 截距 -->
  <circle cx="90" cy="452" r="5.5" fill="#3b7dd8" stroke="#ffffff" stroke-width="2"/>
  <text x="102" y="443" font-size="12.5" fill="#2f5fa8" font-weight="600">固定基座 175MB（store=0 也占着）</text>

  <!-- 字节上限 800MB -->
  <line x1="448" y1="480" x2="448" y2="291" stroke="#2e8b57" stroke-width="2.5"/>
  <circle cx="448" cy="291" r="7" fill="#2e8b57" stroke="#ffffff" stroke-width="2.5"/>
  <g filter="url(#soft)">
    <rect x="330" y="196" width="252" height="76" rx="9" fill="#ffffff" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <text x="344" y="219" font-size="13.5" font-weight="700" fill="#1f6b45">ZKD_MAX_BYTES = 800MB</text>
  <text x="344" y="240" font-size="12.5" fill="#3a4a5c">撑满 → RSS ≈ 1169MB</text>
  <text x="344" y="259" font-size="12.5" fill="#1f6b45" font-weight="600">✓ 在 limit 内，不用改</text>
  <polyline points="456,278 456,272 456,272" fill="none" stroke="#2e8b57" stroke-width="1.6"/>

  <!-- 条数上限 400 → 1847MB -->
  <line x1="916" y1="480" x2="916" y2="82" stroke="#d94b4b" stroke-width="2.5"/>
  <circle cx="916" cy="82" r="7" fill="#d94b4b" stroke="#ffffff" stroke-width="2.5"/>
  <g filter="url(#soft)">
    <rect x="640" y="300" width="286" height="96" rx="9" fill="#ffffff" stroke="#d94b4b" stroke-width="1.6"/>
  </g>
  <text x="654" y="323" font-size="13.5" font-weight="700" fill="#b3352f">ZKD_MAX_CONV = 400 单独</text>
  <text x="654" y="344" font-size="12.5" fill="#3a4a5c">400 × 4.62MB = 1847MB store</text>
  <text x="654" y="363" font-size="12.5" fill="#3a4a5c">→ RSS ≈ 2471MB</text>
  <text x="654" y="382" font-size="12.5" fill="#b3352f" font-weight="600">✗ 单独拦不住，会 OOM</text>
  <polyline points="916,300 916,290 916,290" fill="none" stroke="#d94b4b" stroke-width="1.6"/>
  <polyline points="908,96 908,300" fill="none" stroke="#d94b4b" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.55"/>

  <!-- 拟合公式标注 -->
  <g filter="url(#soft)">
    <rect x="196" y="88" width="300" height="72" rx="9" fill="#ffffff" stroke="#3b7dd8" stroke-width="1.6"/>
  </g>
  <text x="210" y="111" font-size="13.5" font-weight="700" fill="#2f5fa8">边际拟合（正确判法）</text>
  <text x="210" y="132" font-size="12.5" fill="#3a4a5c">rss ≈ 175MB + 1.13 × store</text>
  <text x="210" y="151" font-size="12.5" fill="#3a4a5c">保守取相邻点最大斜率 1.24x（虚线）</text>

  <!-- 被推翻判法标注 -->
  <g filter="url(#soft)">
    <rect x="106" y="176" width="212" height="66" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  </g>
  <text x="118" y="198" font-size="13" font-weight="700" fill="#9a3412">总倍率 rss/store（错的）</text>
  <text x="118" y="217" font-size="12" fill="#6b4423">1 条会话时实测 20.17x</text>
  <text x="118" y="234" font-size="12" fill="#9a3412" font-weight="600">→ 得出「800MB 必须调小」</text>

  <!-- 底部结论条 -->
  <g filter="url(#soft)">
    <rect x="40" y="536" width="940" height="58" rx="10" fill="#ffffff" stroke="#c9d3e2" stroke-width="1.5"/>
  </g>
  <circle cx="70" cy="565" r="12" fill="#2e8b57"/>
  <text x="70" y="570" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="94" y="561" font-size="14" font-weight="700" fill="#1b2536">真正在拦的是字节上限，不是条数上限 —— 两条都得留着。</text>
  <text x="94" y="583" font-size="12.5" fill="#5d6b83">总倍率被固定基座污染（store 小时飙到 20x），照它算的上限小得荒唐；必须拟合「多存 1MB，RSS 多涨多少」。</text>
</svg>
