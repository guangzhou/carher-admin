# Cleans a failed, never-restored clone database PVC before retrying initdb.
# The target claim is intentionally clone A only; use a separately reviewed
# copy for any other clone. This Job has no network access.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-clone-a-data-cleanup
  namespace: litellm-clone
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: litellm-clone-a-data-cleanup
        litellm.carher.io/role: storage-cleanup
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: aiyjy-litellm-standby
      tolerations:
        - key: dedicated
          operator: Equal
          value: standby
          effect: NoSchedule
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: 127.0.0.1:5000/postgres@sha256:adaa8b0891d74ee64cc97119c96b4826190ada4644a41d69dfb6c2d96a27f7a3
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ceu"]
          args:
            - |
              cd /data
              for entry in ./* ./.[!.]* ./..?*; do
                test -e "$entry" || continue
                rm -rf -- "$entry"
              done
              test -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)"
              echo CLONE_DATA_CLEANUP_OK
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-litellm-clone-a-0
