<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="1020" height="640">
  <defs>
    <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5ee"/><stop offset="100%" stop-color="#d3ebdd"/>
    </linearGradient>
    <linearGradient id="gStep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdeceb"/><stop offset="100%" stop-color="#f8dcda"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/><stop offset="100%" stop-color="#fdeed0"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2536" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1020" height="640" fill="#fbfcfe"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#1b2536">全员发：顺序不是随手排的，倒过来就会把同事的 Cursor 弄坏</text>
  <text x="40" y="64" font-size="13.5" fill="#5d6b83">cursor_team_setup.js --apply，2026-08-31 上线（仅 macOS 实测）</text>

  <!-- ============ A 装机顺序 ============ -->
  <text x="40" y="102" font-size="15" font-weight="700" fill="#2f5fa8">装机顺序</text>
  <line x1="112" y1="97" x2="980" y2="97" stroke="#d6dfec" stroke-width="1.5"/>

  <g filter="url(#sh)"><rect x="40" y="118" width="196" height="80" rx="10" fill="url(#gStep)" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <circle cx="64" cy="142" r="11" fill="#3b7dd8"/><text x="64" y="147" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="82" y="147" font-size="13.5" font-weight="700" fill="#1b2536">落文件</text>
  <text x="56" y="169" font-size="12" fill="#4a5668">~/.zk-delta/{sidecar,common}</text>
  <text x="56" y="187" font-size="11.5" fill="#8a97ad">少一个就整步拒绝，不半装</text>

  <polyline points="236,158 268,158" fill="none" stroke="#8a97ad" stroke-width="2"/>
  <polygon points="276,158 266,153 266,163" fill="#8a97ad"/>

  <g filter="url(#sh)"><rect x="278" y="118" width="228" height="80" rx="10" fill="url(#gStep)" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <circle cx="302" cy="142" r="11" fill="#3b7dd8"/><text x="302" y="147" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="320" y="147" font-size="13.5" font-weight="700" fill="#1b2536">起常驻服务（launchd）</text>
  <text x="294" y="169" font-size="12" fill="#4a5668">用 Cursor 自带 Electron 跑</text>
  <text x="294" y="187" font-size="11.5" fill="#8a97ad">ELECTRON_RUN_AS_NODE=1 · 免装 node</text>

  <polyline points="506,158 538,158" fill="none" stroke="#8a97ad" stroke-width="2"/>
  <polygon points="546,158 536,153 536,163" fill="#8a97ad"/>

  <!-- 判断菱形 -->
  <polygon points="660,112 762,158 660,204 558,158" fill="url(#gAmber)" stroke="#d9922a" stroke-width="1.8" filter="url(#sh)"/>
  <text x="660" y="152" font-size="13" font-weight="700" fill="#8a5a10" text-anchor="middle">12 秒内</text>
  <text x="660" y="171" font-size="13" font-weight="700" fill="#8a5a10" text-anchor="middle">/healthz 通了吗</text>

  <!-- yes 分支 -->
  <polyline points="762,158 800,158" fill="none" stroke="#2e8b57" stroke-width="2.2"/>
  <polygon points="808,158 798,153 798,163" fill="#2e8b57"/>
  <text x="778" y="149" font-size="11.5" font-weight="700" fill="#2e8b57" text-anchor="middle">通</text>
  <g filter="url(#sh)"><rect x="810" y="120" width="170" height="76" rx="10" fill="url(#gOk)" stroke="#2e8b57" stroke-width="1.6"/></g>
  <circle cx="834" cy="144" r="11" fill="#2e8b57"/><text x="834" y="149" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="852" y="149" font-size="13.5" font-weight="700" fill="#1f6b45">才改 BYOK 地址</text>
  <text x="826" y="171" font-size="12" fill="#3a4a5c">→ 127.0.0.1:8788</text>
  <text x="826" y="189" font-size="11.5" fill="#5d6b83">此后走增量</text>

  <!-- no 分支 -->
  <polyline points="660,204 660,240 810,240" fill="none" stroke="#d94b4b" stroke-width="2.2"/>
  <polygon points="818,240 808,235 808,245" fill="#d94b4b"/>
  <text x="676" y="226" font-size="11.5" font-weight="700" fill="#d94b4b">不通</text>
  <g filter="url(#sh)"><rect x="820" y="212" width="160" height="58" rx="10" fill="url(#gBad)" stroke="#d94b4b" stroke-width="1.6"/></g>
  <text x="836" y="236" font-size="13" font-weight="700" fill="#b3352f">本次不改地址</text>
  <text x="836" y="256" font-size="11.5" fill="#7d3b37">保持公网直连 + 打日志</text>

  <!-- 反例说明 -->
  <g filter="url(#sh)"><rect x="40" y="212" width="500" height="66" rx="10" fill="#fff5f5" stroke="#d94b4b" stroke-width="1.4"/></g>
  <text x="58" y="235" font-size="13" font-weight="700" fill="#b3352f">✗ 倒过来的后果：先改地址、再起服务</text>
  <text x="58" y="256" font-size="12" fill="#6b4441">服务起不来，而 Cursor 已经指向一个死端口 → 连不上任何模型</text>
  <text x="58" y="272" font-size="11.5" fill="#9a5c58">= 把同事的 Cursor 弄坏。所以「先起、后改」是硬顺序，不是风格。</text>

  <!-- ============ B 运行形状 ============ -->
  <text x="40" y="322" font-size="15" font-weight="700" fill="#2f5fa8">跑起来之后的形状</text>
  <line x1="188" y1="317" x2="980" y2="317" stroke="#d6dfec" stroke-width="1.5"/>

  <g filter="url(#sh)"><rect x="40" y="338" width="132" height="62" rx="9" fill="url(#gStep)" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <text x="106" y="365" font-size="13.5" font-weight="700" fill="#1b2536" text-anchor="middle">Cursor</text>
  <text x="106" y="384" font-size="11.5" fill="#8a97ad" text-anchor="middle">每轮重发全量</text>

  <polyline points="172,369 206,369" fill="none" stroke="#8a97ad" stroke-width="2"/><polygon points="214,369 204,364 204,374" fill="#8a97ad"/>

  <g filter="url(#sh)"><rect x="216" y="338" width="158" height="62" rx="9" fill="url(#gStep)" stroke="#3b7dd8" stroke-width="1.8"/></g>
  <text x="295" y="365" font-size="13.5" font-weight="700" fill="#2f5fa8" text-anchor="middle">本机小代理 :8788</text>
  <text x="295" y="384" font-size="11.5" fill="#5d6b83" text-anchor="middle">抓包硬关 CAPTURE_MAX=0</text>

  <polyline points="374,369 424,369" fill="none" stroke="#2e8b57" stroke-width="2.6"/><polygon points="432,369 422,364 422,374" fill="#2e8b57"/>
  <text x="403" y="359" font-size="11.5" font-weight="700" fill="#2e8b57" text-anchor="middle">只发增量</text>
  <text x="403" y="392" font-size="11" fill="#5d6b83" text-anchor="middle">实测省 86%</text>

  <g filter="url(#sh)"><rect x="434" y="338" width="164" height="62" rx="9" fill="url(#gStep)" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <text x="516" y="365" font-size="13.5" font-weight="700" fill="#1b2536" text-anchor="middle">198 · zk-delta</text>
  <text x="516" y="384" font-size="11.5" fill="#8a97ad" text-anchor="middle">逐字节重建成全量</text>

  <polyline points="598,369 632,369" fill="none" stroke="#8a97ad" stroke-width="2"/><polygon points="640,369 630,364 630,374" fill="#8a97ad"/>

  <g filter="url(#sh)"><rect x="642" y="338" width="120" height="62" rx="9" fill="url(#gStep)" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <text x="702" y="373" font-size="13.5" font-weight="700" fill="#1b2536" text-anchor="middle">LiteLLM</text>

  <polyline points="762,369 796,369" fill="none" stroke="#8a97ad" stroke-width="2"/><polygon points="804,369 794,364 794,374" fill="#8a97ad"/>

  <g filter="url(#sh)"><rect x="806" y="338" width="174" height="62" rx="9" fill="url(#gOk)" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="893" y="365" font-size="13.5" font-weight="700" fill="#1f6b45" text-anchor="middle">网关 → GPT 网页</text>
  <text x="893" y="384" font-size="11.5" fill="#3a4a5c" text-anchor="middle">收到的字节与不装时相同</text>

  <!-- 重建位置的关键含义 -->
  <polyline points="516,338 516,322 516,322" fill="none" stroke="#2e8b57" stroke-width="1.4"/>
  <g filter="url(#sh)"><rect x="40" y="416" width="940" height="48" rx="9" fill="#f2f8f5" stroke="#2e8b57" stroke-width="1.4"/></g>
  <text x="58" y="437" font-size="13" font-weight="700" fill="#1f6b45">重建发生在 LiteLLM 之前 —— 这一条同时买到两件事：</text>
  <text x="58" y="456" font-size="12" fill="#3a4a5c">① 门①（干净载荷）按构造成立，上游收到的字节逐字节相同；② zk-delta 按构造改不了 ChatGPT 侧的 24h/7d 配额消耗。</text>

  <!-- ============ C 三层兜底 ============ -->
  <text x="40" y="508" font-size="15" font-weight="700" fill="#2f5fa8">三层失效兜底（都实测过）</text>
  <line x1="228" y1="503" x2="980" y2="503" stroke="#d6dfec" stroke-width="1.5"/>

  <g filter="url(#sh)"><rect x="40" y="524" width="300" height="88" rx="10" fill="#ffffff" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <circle cx="66" cy="550" r="12" fill="#3b7dd8"/><text x="66" y="555" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="86" y="555" font-size="13.5" font-weight="700" fill="#1b2536">集群挂了</text>
  <text x="58" y="578" font-size="12" fill="#4a5668">小代理自动回落直连公网</text>
  <text x="58" y="596" font-size="11.5" fill="#8a97ad">用户无感，只是不省流量</text>

  <g filter="url(#sh)"><rect x="360" y="524" width="300" height="88" rx="10" fill="#ffffff" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <circle cx="386" cy="550" r="12" fill="#d9922a"/><text x="386" y="555" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="406" y="555" font-size="13.5" font-weight="700" fill="#1b2536">小代理进程挂了</text>
  <text x="378" y="578" font-size="12" fill="#4a5668">launchd KeepAlive 约 1 秒拉起</text>
  <text x="378" y="596" font-size="11.5" fill="#8a97ad">内存里的会话句柄丢 → 下一发重发全量</text>

  <g filter="url(#sh)"><rect x="680" y="524" width="300" height="88" rx="10" fill="#ffffff" stroke="#b9c7dc" stroke-width="1.5"/></g>
  <circle cx="706" cy="550" r="12" fill="#2e8b57"/><text x="706" y="555" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="726" y="555" font-size="13.5" font-weight="700" fill="#1b2536">想彻底退出</text>
  <text x="698" y="578" font-size="12" fill="#4a5668">双击 TURN-OFF-DELTA-Mac.command</text>
  <text x="698" y="596" font-size="11.5" fill="#8a97ad">卸服务 + 地址还原，不用找管理员</text>
</svg>
