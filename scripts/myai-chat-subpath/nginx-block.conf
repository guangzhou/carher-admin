    # >>> myai-subpath >>> myai(通衢 API) 国内入口 → 243 NodePort 30810(deploy/ai-token-dashboard-chat)。回滚=删这一段
    # 前端写死了根路径 /api、/assets ⇒ 用 sub_filter 改写成 /myai/...；后端的跳转和 cookie 路径同理。见 scripts/myai-chat-subpath/
    # 相对跳转：IT 入口回源是 http，绝对跳转会带成 http://（对外 80 不通）
    location = /myai { absolute_redirect off; return 302 /myai/; }
    location ^~ /myai/ {
        proxy_pass http://10.68.13.243:30810/;
        proxy_http_version 1.1;
        proxy_set_header Host chat.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # sub_filter 只能改未压缩的响应；对外的压缩由本机 nginx 的 gzip 再做
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        client_max_body_size 25M;

        # 后端 RedirectResponse("/?auth_callback=success") 一类的相对根路径跳转 → /myai/...
        # 🔴 只改相对路径：SSO 的绝对跳转（dash.auto-link.com.cn / accounts.feishu.cn）必须原样放行
        # 🔴 替换串必须写全 https 域名：写成 /myai/$1 时 nginx 会自己补成 http://<server_name>/...，对外 80 不通 ⇒ 登录完落空页（10-19 桩测抓到）
        proxy_redirect ~^/(.*)$ https://chat.auto-link.com.cn/myai/$1;
        # session cookie 只在 /myai 下发送，不和 Open WebUI 的 cookie 混在一起
        proxy_cookie_path / /myai/;

        sub_filter_types text/javascript application/javascript;
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="/myai/assets/';
        sub_filter '"/api' '"/myai/api';
        sub_filter '`/api' '`/myai/api';
    }
    # <<< myai-subpath <<<
