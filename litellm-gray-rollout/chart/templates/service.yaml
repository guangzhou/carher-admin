apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm-proxy.name" . }}-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-proxy.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "litellm-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
