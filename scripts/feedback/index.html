<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>意见反馈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 和一键配置页同一套视觉:单栏 720,卡片表单;顶部写清「谁在提交」,底部「我的反馈」 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#151c27; --muted:#5d6878; --line:#e0e4ea;
  --code-bg:#eef1f5; --accent:#2f5bd3; --t:#0d7a6b; --on-t:#ffffff; --err:#b3261e; --err-bg:#fdecea;
  --s-new:#2f5bd3; --s-doing:#c06a00; --s-done:#1f7a3d; --s-off:#6b7280;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf3; --muted:#9aa6b6; --line:#29323f;
  --code-bg:#1f2834; --accent:#86a7ff; --t:#3fc2ad; --on-t:#0f141b; --err:#ff8a80; --err-bg:#3a1d1b;
  --s-new:#86a7ff; --s-doing:#f0a54a; --s-done:#5fd08a; --s-off:#9aa6b6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf3; --muted:#9aa6b6; --line:#29323f;
  --code-bg:#1f2834; --accent:#86a7ff; --t:#3fc2ad; --on-t:#0f141b; --err:#ff8a80; --err-bg:#3a1d1b;
  --s-new:#86a7ff; --s-doing:#f0a54a; --s-done:#5fd08a; --s-off:#9aa6b6; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.7;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:28px;font-weight:900;margin:0;line-height:1.3}
h2{font-size:17px;margin:0}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
.lead{color:var(--muted);margin-top:4px}
.sub{font-size:13.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.who{display:flex;align-items:center;gap:10px;font-size:14.5px}
.who b{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-done);flex:none}
label.q{display:flex;flex-direction:column;gap:6px;font-weight:500}
label.q > span small{font-weight:400;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14.5px;background:var(--surface)}
.chips label:hover{border-color:var(--muted)}
.chips input:checked + label{border-color:var(--t);background:var(--t);color:var(--on-t);font-weight:700}
.chips input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.group{display:flex;flex-direction:column;gap:6px}
.group > span{font-weight:500}
.group > span small{font-weight:400;color:var(--muted);margin-left:6px}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
textarea{min-height:130px;resize:vertical;font-size:14.5px}
textarea.mono{font-family:var(--font-mono);font-size:13px}
input:focus,textarea:focus{outline:none;border-color:var(--t)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop:hover,.drop.on{border-color:var(--t);color:var(--fg)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:88px;height:66px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:20px;height:20px;line-height:20px;padding:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;background:var(--t);color:var(--on-t);font:inherit;font-weight:700;padding:10px 24px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:none;color:var(--t);border:1.5px solid var(--t);padding:8.5px 22px}
.err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 14px;font-size:14px}
.ok{text-align:center;padding:28px 18px;gap:10px}
.ok .big{font-size:40px;line-height:1}
.ok h2{font-size:20px}
.no{font-family:var(--font-mono);font-weight:500;background:var(--code-bg);padding:2px 8px;border-radius:5px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.item:first-child{border-top:0}
.item .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .m{grid-column:2 / 4;font-size:13px;color:var(--muted)}
.item .r{grid-column:2 / 4;font-size:14px;background:var(--code-bg);border-radius:7px;padding:8px 12px;white-space:pre-wrap}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1.5px solid currentColor}
.pill.s-新提交,.pill.s-已确认{color:var(--s-new)}
.pill.s-处理中{color:var(--s-doing)}
.pill.s-已解决{color:var(--s-done)}
.pill.s-不处理,.pill.s-重复{color:var(--s-off)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
@media (max-width:560px){h1{font-size:23px}.row2{grid-template-columns:1fr}.card{padding:16px}}
</style></head>
<body>
<div class="wrap">
  <header>
    <h1>意见反馈</h1>
    <p class="lead">用不了、报错、想要新模型、文档看不懂，都可以在这里说。问题解决后会在飞书通知你。</p>
  </header>

  <!-- 加载中 / 未登录 -->
  <div class="card" id="v-loading"><p class="sub">正在确认你的飞书登录…</p></div>
  <div class="card" id="v-login" hidden>
    <h2>先用飞书登录</h2>
    <p>反馈需要知道是谁提的，才能在问题解决后通知你。点下面的按钮用飞书登录，登录完会自动回到这里。</p>
    <div class="actions"><a class="btn" id="login-btn" href="/auth">用飞书登录</a></div>
  </div>

  <!-- 表单 -->
  <form class="card" id="v-form" hidden novalidate>
    <div class="who"><span class="dot"></span><span>你好，<b id="who-name"></b>。提交后用这个飞书账号通知你。</span></div>

    <div class="group" role="radiogroup" aria-labelledby="l-type"><span id="l-type">是什么事</span><div class="chips" id="c-类型"></div></div>
    <div class="group" role="radiogroup" aria-labelledby="l-tool"><span id="l-tool">哪个工具</span><div class="chips" id="c-工具"></div></div>

    <label class="q"><span>一句话说明</span>
      <input type="text" id="f-title" maxlength="200" placeholder="例如:Cursor 里选 opus 一直报 403" required></label>

    <label class="q"><span>详细情况<small>选填。报错原文、自检报告整段粘进来最好</small></span>
      <textarea id="f-detail" maxlength="20000" placeholder="什么时候、做了什么、看到什么报错…"></textarea></label>

    <div class="group"><span>截图<small>选填，最多 3 张，每张小于 5MB。也可以直接 Ctrl/Cmd+V 粘贴</small></span>
      <div class="drop" id="drop" tabindex="0" role="button">点这里选图片，或把图片拖进来</div>
      <input type="file" id="f-files" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="row2">
      <div class="group" role="radiogroup" aria-labelledby="l-os"><span id="l-os">电脑</span><div class="chips" id="c-电脑"></div></div>
      <div class="group" role="radiogroup" aria-labelledby="l-urg"><span id="l-urg">有多急</span><div class="chips" id="c-紧急程度"></div></div>
    </div>

    <div class="err" id="f-err" hidden></div>
    <div class="actions"><button type="submit" class="btn" id="f-submit">提交</button>
      <span class="sub">只有你和运维能看到你提的内容。</span></div>
  </form>

  <!-- 提交成功 -->
  <div class="card ok" id="v-ok" hidden>
    <div class="big">✅</div>
    <h2>收到了</h2>
    <p>编号 <span class="no" id="ok-no"></span>，处理好后会在飞书通知你。</p>
    <div class="actions" style="justify-content:center"><button class="btn alt" id="again" type="button">再提一个</button></div>
  </div>

  <!-- 我的反馈 -->
  <section class="card" id="mine" hidden>
    <h2>我提过的</h2>
    <div class="list" id="mine-list"><p class="empty">加载中…</p></div>
  </section>

  <p class="sub">想看配置教程:<a href="/oneclick/">AI 编程一键配置</a></p>
</div>

<script>
(function(){
  var API = 'api', $ = function(id){return document.getElementById(id)};
  var DEFAULTS = {'紧急程度':'不急'};
  var params = new URLSearchParams(location.search);
  var source = params.get('from') || document.referrer || '';
  var images = [];

  function show(id){ ['v-loading','v-login','v-form','v-ok'].forEach(function(v){ $(v).hidden = (v !== id); }); }
  function guessOS(){ var u=navigator.userAgent||''; return /Windows/i.test(u)?'Windows':/Mac/i.test(u)?'Mac':/Linux/i.test(u)?'Linux':'不确定'; }
  function guessTool(){ var s=(params.get('tool')||source).toLowerCase(); return /codex/.test(s)?'Codex':/claude/.test(s)?'Claude Code':/cursor/.test(s)?'Cursor':''; }

  function chips(field, options, preset){
    var box = $('c-'+field); box.innerHTML='';
    options.forEach(function(o, i){
      var id = 'r-'+field+'-'+i;
      var inp = document.createElement('input'); inp.type='radio'; inp.name=field; inp.id=id; inp.value=o;
      if (o === preset) inp.checked = true;
      var lb = document.createElement('label'); lb.htmlFor=id; lb.textContent=o;
      box.appendChild(inp); box.appendChild(lb);
    });
  }
  function val(field){ var c=document.querySelector('input[name="'+field+'"]:checked'); return c?c.value:''; }

  function addFiles(list){
    for (var i=0;i<list.length && images.length<3;i++){
      var f=list[i]; if(!/^image\//.test(f.type)) continue;
      if (f.size > 5*1024*1024){ err('截图「'+f.name+'」超过 5MB'); continue; }
      (function(f){ var r=new FileReader(); r.onload=function(){ images.push({name:f.name||'paste.png', url:r.result}); renderThumbs(); }; r.readAsDataURL(f); })(f);
    }
  }
  function renderThumbs(){
    var b=$('thumbs'); b.innerHTML='';
    images.forEach(function(im, i){
      var d=document.createElement('div'); d.className='thumb';
      var img=document.createElement('img'); img.src=im.url; img.alt=im.name;
      var x=document.createElement('button'); x.type='button'; x.textContent='×'; x.setAttribute('aria-label','删掉这张');
      x.onclick=function(){ images.splice(i,1); renderThumbs(); };
      d.appendChild(img); d.appendChild(x); b.appendChild(d);
    });
    $('drop').hidden = images.length >= 3;
  }
  function err(m){ var e=$('f-err'); e.textContent=m; e.hidden=!m; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function fmt(ts){ if(!ts) return ''; var d=new Date(ts); return (d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function loadMine(){
    $('mine').hidden=false;
    fetch(API+'/mine',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){
      var items=d.items||[], box=$('mine-list');
      if(!items.length){ box.innerHTML='<p class="empty">还没有提过反馈。</p>'; return; }
      box.innerHTML = items.map(function(it){
        return '<div class="item"><span class="no">'+esc(it.no||'—')+'</span><span class="t">'+esc(it.title)+'</span>'+
          '<span class="pill s-'+esc(it.status)+'">'+esc(it.status)+'</span>'+
          '<span class="m">'+esc(it.tool)+' · '+esc(it.type)+' · '+fmt(it.at)+'</span>'+
          (it.reply?'<span class="r">'+esc(it.reply)+'</span>':'')+'</div>';
      }).join('');
    }).catch(function(){ $('mine-list').innerHTML='<p class="empty">暂时读不到，稍后刷新试试。</p>'; });
  }

  // 登录后回到本页:Open WebUI 登录页认 ?redirect=
  $('login-btn').href = '/auth?redirect=' + encodeURIComponent(location.pathname + location.search + location.hash);

  fetch(API+'/me',{credentials:'same-origin'}).then(function(r){ return r.status===401 ? null : r.json(); }).then(function(me){
    if(!me){ show('v-login'); return; }
    $('who-name').textContent = me.name || me.email;
    var c = me.choices;
    chips('类型', c['类型'], params.get('type')||'');
    chips('工具', c['工具'], guessTool());
    chips('电脑', c['电脑'], guessOS());
    chips('紧急程度', c['紧急程度'], DEFAULTS['紧急程度']);
    show('v-form'); loadMine();
    if (location.hash === '#mine') $('mine').scrollIntoView();
  }).catch(function(){ show('v-login'); });

  var drop=$('drop'), files=$('f-files');
  drop.onclick=function(){ files.click(); };
  drop.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); files.click(); } };
  files.onchange=function(){ addFiles(files.files); files.value=''; };
  ['dragover','dragenter'].forEach(function(t){ drop.addEventListener(t,function(e){ e.preventDefault(); drop.classList.add('on'); }); });
  ['dragleave','drop'].forEach(function(t){ drop.addEventListener(t,function(e){ e.preventDefault(); drop.classList.remove('on'); }); });
  drop.addEventListener('drop',function(e){ addFiles(e.dataTransfer.files); });
  document.addEventListener('paste',function(e){ if($('v-form').hidden) return; var it=(e.clipboardData||{}).items||[]; var fs=[]; for(var i=0;i<it.length;i++){ if(it[i].kind==='file') fs.push(it[i].getAsFile()); } if(fs.length) addFiles(fs); });

  $('v-form').addEventListener('submit',function(e){
    e.preventDefault(); err('');
    var body = {title:$('f-title').value.trim(), detail:$('f-detail').value, source:source.slice(0,300),
      '类型':val('类型'), '工具':val('工具'), '电脑':val('电脑'), '紧急程度':val('紧急程度'),
      images: images.map(function(im){ return {name:im.name, data:im.url.split(',')[1]}; })};
    if(!body['类型']) return err('请选「是什么事」');
    if(!body['工具']) return err('请选「哪个工具」');
    if(!body.title) { $('f-title').focus(); return err('请写一句话说明'); }
    var b=$('f-submit'); b.disabled=true; b.textContent='提交中…';
    fetch(API+'/submit',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(x){
        if(x.s===401){ show('v-login'); return; }
        if(x.s!==200){ err(x.d.error||'提交失败，稍后再试'); return; }
        $('ok-no').textContent = x.d.no || '已记录';
        show('v-ok'); loadMine();
        $('v-form').reset(); images=[]; renderThumbs();
      }).catch(function(){ err('网络断了，内容还在，再点一次提交'); })
      .then(function(){ b.disabled=false; b.textContent='提交'; });
  });
  $('again').onclick=function(){ show('v-form'); chips('电脑', ['Mac','Windows','Linux','不确定'], guessOS()); chips('紧急程度',['影响工作','有替代办法','不急'],'不急'); };
})();
</script>
</body></html>
