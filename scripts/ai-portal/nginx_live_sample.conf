# chat.auto-link.com.cn → Open WebUI (NodePort 30880)
# SSL 由 58.241.5.230 那层终结, 本机只接 HTTP/80

map $http_upgrade $connection_upgrade_owui {
    default upgrade;
    ""      close;
}

upstream open_webui_upstream {
    server 127.0.0.1:30880;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.auto-link.com.cn;

    # 通用 streaming 配置 (OWUI SSE 必需)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection $connection_upgrade_owui;
    proxy_set_header Upgrade $http_upgrade;

    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    client_max_body_size 100M;
    large_client_header_buffers 8 64k;

    # OAuth callback 含大 Set-Cookie + 加密 session, 默认 buffer 4-8k 不够
    proxy_buffer_size       256k;
    proxy_buffers           16 256k;
    proxy_busy_buffers_size 256k;

    # >>> carher-oneclick >>> AI 编程一键配置单页(静态,只读)。回滚=删这一段
    location = /oneclick { return 301 /oneclick/; }
    location ^~ /oneclick/ {
        alias /var/www/oneclick/;
        index index.html;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
    }
    # <<< carher-oneclick <<<
    # >>> keyprobe >>> LiteLLM Key 体检页。回滚=删这一段
    location = /keyprobe { return 301 /keyprobe/; }
    location ^~ /keyprobe/ {
        proxy_pass http://127.0.0.1:30920/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 10M;
    }
    # <<< keyprobe <<<
    # >>> carher-feedback >>> 意见反馈页(静态)+ 小服务(127.0.0.1:8792)。回滚=删这一段
    location = /feedback { return 301 /feedback/; }
    location ^~ /feedback/api/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 25M;
        proxy_read_timeout 120s;
    }
    location ^~ /feedback/ {
        alias /var/www/feedback/;
        index index.html;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
    }
    # <<< carher-feedback <<<
    # >>> myai-subpath >>> myai(通衢 API) 国内入口 → 243 NodePort 30810(deploy/ai-token-dashboard-chat)。回滚=删这一段
    # 前端写死了根路径 /api、/assets ⇒ 用 sub_filter 改写成 /myai/...；后端的跳转和 cookie 路径同理。见 scripts/myai-chat-subpath/
    # 相对跳转：IT 入口回源是 http，绝对跳转会带成 http://（对外 80 不通）
    location = /myai { absolute_redirect off; return 302 /myai/; }
    location ^~ /myai/ {
        proxy_pass http://10.68.13.243:30810/;
        proxy_http_version 1.1;
        proxy_set_header Host chat.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # sub_filter 只能改未压缩的响应；对外的压缩由本机 nginx 的 gzip 再做
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        client_max_body_size 25M;

        # 后端 RedirectResponse("/?auth_callback=success") 一类的相对根路径跳转 → /myai/...
        # 🔴 只改相对路径：SSO 的绝对跳转（dash.auto-link.com.cn / accounts.feishu.cn）必须原样放行
        # 🔴 替换串必须写全 https 域名：写成 /myai/$1 时 nginx 会自己补成 http://<server_name>/...，对外 80 不通 ⇒ 登录完落空页（10-19 桩测抓到）
        proxy_redirect ~^/(.*)$ https://chat.auto-link.com.cn/myai/$1;
        # session cookie 只在 /myai 下发送，不和 Open WebUI 的 cookie 混在一起
        proxy_cookie_path / /myai/;

        sub_filter_types text/javascript application/javascript;
        sub_filter_once off;
        sub_filter 'src="/assets/' 'src="/myai/assets/';
        sub_filter '"/api' '"/myai/api';
        sub_filter '`/api' '`/myai/api';
    }
    # <<< myai-subpath <<<

    # >>> chat-subpath:model >>> 127.0.0.1:80 Host=cc /pro/（2026-10-30 Liuguoxian，scripts/chat-model-subpath/deploy.sh）。回滚=host-198-chat-subpath.sh remove model
    location = /model { absolute_redirect off; return 302 /model/; }
    location = /model/ { default_type text/plain; return 200 "ok\n"; }
    location ^~ /model/ {
        # 管理页/文档不对外（页面里写死 /pro/）
        if ($uri ~ "^/model/(ui|_next|swagger|litellm-asset-prefix|openapi\.json|docs|redoc)(/|$)") { return 404; }
        proxy_pass http://127.0.0.1:80/pro/;
        proxy_set_header Host cc.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LLM-Debug "";
        # 入口标记（只观测）：LiteLLM 原生把这个头写进 SpendLogs.metadata.spend_logs_metadata ⇒ 统计谁走新地址。
        # 覆盖客户端自带的同名头；cc 直连的请求没有这个标记。客户端能在 cc 上伪造它 ⇒ 只能当统计，不能当拦截依据。
        proxy_set_header x-litellm-spend-logs-metadata '{"entry":"chat"}';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_owui;
        # cc 侧若回跳转，/pro/… 一律改回 /model/…（相对/绝对两种都兜）
        proxy_redirect ~^(?:https?://cc\.auto-link\.com\.cn)?/pro/(.*)$ https://chat.auto-link.com.cn/model/$1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        # 与 cc 一致：body 不限、header buffer 512k（/v1/responses 头可达数十 KB）
        client_max_body_size 0;
        proxy_buffer_size       512k;
        proxy_buffers           16 512k;
        proxy_busy_buffers_size 1024k;
        # 比 cc 的 570s 略长：让里层先超时、回干净的 504
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # <<< chat-subpath:model <<<
    # >>> chat-subpath:muse-media >>> 127.0.0.1:80 Host=cc 同路径（2026-10-29 Liuguoxian，scripts/chat-model-subpath/cc-paths.sh）。回滚=host-198-chat-subpath.sh remove muse-media
    location ~ "^/muse-media/(?:v1/media/)?([0-9a-f]{32}\.(?:webp|png|jpg|jpeg|mp4))$" {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:80/muse-media/v1/media/$1;
        proxy_set_header Host cc.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    # <<< chat-subpath:muse-media <<<
    # >>> chat-subpath:gemini-media >>> 127.0.0.1:80 Host=cc 同路径（2026-10-29 Liuguoxian，scripts/chat-model-subpath/cc-paths.sh）。回滚=host-198-chat-subpath.sh remove gemini-media
    location ~ "^/gemini-media/openai/v1/media/([0-9a-f]{32})$" {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:80/gemini-media/openai/v1/media/$1;
        proxy_set_header Host cc.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    # <<< chat-subpath:gemini-media <<<
    # >>> chat-subpath:ccdl >>> 127.0.0.1:80 Host=cc 同路径（2026-10-29 Liuguoxian，scripts/chat-model-subpath/cc-paths.sh）。回滚=host-198-chat-subpath.sh remove ccdl
    location ^~ /ccdl/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:80/ccdl/;
        proxy_set_header Host cc.auto-link.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 大文件（Cursor/Codex 安装包上百 MB）：流式透传，不落临时文件
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    # <<< chat-subpath:ccdl <<<
    # >>> chat-subpath:zkd >>> 127.0.0.1:80 Host=cc 同路径（2026-10-29 Liuguoxian，scripts/chat-model-subpath/cc-paths.sh）。回滚=host-198-chat-subpath.sh remove zkd
    location ^~ /zkd/ {
        proxy_pass http://127.0.0.1:80/zkd/;
        proxy_set_header Host cc.auto-link.com.cn;
        # 入口标记(只观测,10-31 Liuguoxian):与 /model/ 段同一行。小代理(zk-delta)把客户端头原样转给 LiteLLM,
        # 不打这行 ⇒ 走新地址的 Cursor 小代理流量在 entry-report 里被算成「老地址」。
        proxy_set_header x-litellm-spend-logs-metadata '{"entry":"chat"}';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-LLM-Debug "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        # 与 cc server 级一致：流式、body 不限、header buffer 512k
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_buffer_size       512k;
        proxy_buffers           16 512k;
        proxy_busy_buffers_size 1024k;
        # 比 cc 的 600s 略长：让里层先超时、回干净的 504
        proxy_connect_timeout 60s;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
    }
    # <<< chat-subpath:zkd <<<
    # >>> chat-subpath:kr >>> 127.0.0.1:30891（2026-10-31 Liuguoxian，scripts/host-198-chat-subpath.sh）。回滚=remove kr
    location = /kr { absolute_redirect off; return 302 /kr/admin; }
    location = /kr/ { absolute_redirect off; return 302 /kr/admin; }
    location ^~ /kr/ {
        proxy_pass http://127.0.0.1:30891/;
        # 服务回的根路径跳转 / cookie 补回前缀；替换串必须写全 https 域名（写相对路径 nginx 会补成 http://，对外 80 不通）
        proxy_redirect ~^/(.*)$ https://chat.auto-link.com.cn/kr/$1;
        proxy_cookie_path / /kr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /kr;
        # 前端写死的根路径改写（同 myai）；sub_filter 只改未压缩响应 ⇒ 不让上游压缩
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/javascript application/javascript;
        sub_filter_once off;
        sub_filter '"/admin/' '"/kr/admin/';
        sub_filter '"/api/admin' '"/kr/api/admin';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 32m;
    }
    # <<< chat-subpath:kr <<<
    # >>> carher-ai-portal >>> AI 自助门户(127.0.0.1:8793)+ 一行命令安装器(/var/www/ai-installer)。回滚=删这一段
    location = /ai { return 301 /ai/; }
    location = /ai/i/all.sh { alias /var/www/ai-installer/install.sh; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/all.ps1 { alias /var/www/ai-installer/install.ps1; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/cursor.sh { alias /var/www/ai-installer/install.sh; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/cursor.ps1 { alias /var/www/ai-installer/install.ps1; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/codex.sh { alias /var/www/ai-installer/install.sh; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/codex.ps1 { alias /var/www/ai-installer/install.ps1; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/claude.sh { alias /var/www/ai-installer/install.sh; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location = /ai/i/claude.ps1 { alias /var/www/ai-installer/install.ps1; types { } default_type "text/plain; charset=utf-8"; add_header Cache-Control "no-cache" always; limit_except GET HEAD { deny all; } }
    location ^~ /ai/i/pkg/ {
        alias /var/www/ai-installer/pkg/;
        types { application/zip zip; }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /ai/i/ { return 404; }
    # >>> carher-ai-portal:internal >>> 11-04 红队 P0-3:签发一次性登录链接的内部接口原来公网可达,
    # 只靠 INTERNAL_SECRET 挡着,而拿到它就能给**任意** union_id 签出会话 ⇒ 1452 把 key 全漏。
    # 机器人和门户同机 ⇒ 只放本机。回滚=删这一段。
    location ^~ /ai/api/internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }
    # <<< carher-ai-portal:internal <<<
    # >>> carher-ai-portal:harden >>> 11-04 P2-3:一次性登录 token 在 query 里,这条路径不记访问日志;
    # realip:只信前置代理 10.68.13.97 的 X-Real-IP(它会覆盖客户端伪造的值,11-04 实测)。回滚=删这一段 + 下面两行 realip
    location = /ai/auth/magic {
        access_log off;
        set_real_ip_from 10.68.13.97;
        real_ip_header X-Real-IP;
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }
    # <<< carher-ai-portal:harden <<<
    location ^~ /ai/ {
        proxy_pass http://127.0.0.1:8793;
        set_real_ip_from 10.68.13.97;
        real_ip_header X-Real-IP;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 2M;
        proxy_read_timeout 60s;
    }
    # <<< carher-ai-portal <<<
    location / {
        proxy_pass http://open_webui_upstream;
    }
}
