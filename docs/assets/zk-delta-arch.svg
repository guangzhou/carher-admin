<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2329">zk-delta：增量只压跨公网那一跳，集群里重建成原样</text>

  <!-- 公网 / 集群 分区底色 -->
  <rect x="30" y="66" width="360" height="250" rx="10" fill="#f5f7fa" stroke="#c9cdd4" stroke-dasharray="5 4"/>
  <text x="46" y="88" font-size="13" fill="#8f959e">你的电脑</text>
  <rect x="470" y="66" width="400" height="250" rx="10" fill="#f2f8f4" stroke="#b7d9c3" stroke-dasharray="5 4"/>
  <text x="486" y="88" font-size="13" fill="#5a9c76">198 集群内网</text>

  <!-- 节点 -->
  <rect x="56" y="150" width="130" height="62" rx="8" fill="#ffffff" stroke="#3370ff" stroke-width="2"/>
  <text x="121" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2329">Cursor</text>
  <text x="121" y="196" text-anchor="middle" font-size="11" fill="#8f959e">每轮重发全量</text>

  <rect x="234" y="150" width="140" height="62" rx="8" fill="#ffffff" stroke="#3370ff" stroke-width="2"/>
  <text x="304" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2329">本机小代理</text>
  <text x="304" y="190" text-anchor="middle" font-size="11" fill="#8f959e">:8788 逐条自证</text>
  <text x="304" y="205" text-anchor="middle" font-size="11" fill="#8f959e">证不出就原样透传</text>

  <rect x="494" y="150" width="150" height="62" rx="8" fill="#ffffff" stroke="#00b42a" stroke-width="2"/>
  <text x="569" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2329">zk-delta</text>
  <text x="569" y="190" text-anchor="middle" font-size="11" fill="#8f959e">重建全量</text>
  <text x="569" y="205" text-anchor="middle" font-size="11" fill="#00934a">逐字节相同</text>

  <rect x="700" y="150" width="150" height="62" rx="8" fill="#ffffff" stroke="#8f959e" stroke-width="2"/>
  <text x="775" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2329">LiteLLM</text>
  <text x="775" y="190" text-anchor="middle" font-size="11" fill="#8f959e">→ 网关 → GPT 网页</text>
  <text x="775" y="205" text-anchor="middle" font-size="11" fill="#8f959e">完全不知情</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4e5969"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#00b42a"/>
    </marker>
  </defs>

  <!-- 箭头 -->
  <line x1="188" y1="181" x2="228" y2="181" stroke="#4e5969" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="208" y="172" text-anchor="middle" font-size="10" fill="#8f959e">2.2MB</text>

  <!-- 跨公网：细箭头 -->
  <line x1="376" y1="181" x2="490" y2="181" stroke="#00b42a" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="433" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#00934a">跨 公 网</text>
  <text x="433" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#00934a">只发 123KB</text>
  <text x="433" y="206" text-anchor="middle" font-size="10" fill="#8f959e">nginx /zkd/</text>

  <line x1="646" y1="181" x2="696" y2="181" stroke="#4e5969" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="671" y="172" text-anchor="middle" font-size="10" fill="#8f959e">2.2MB</text>

  <!-- 底部结论条 -->
  <rect x="30" y="336" width="840" height="62" rx="8" fill="#fff7e8" stroke="#ff9a2e"/>
  <text x="50" y="360" font-size="13.5" font-weight="bold" fill="#1f2329">上游收到的字节，与没有 zk-delta 时完全相同。</text>
  <text x="50" y="382" font-size="12.5" fill="#4e5969">所以它不改变任何模型行为，门① 结构上不可能被它破坏 —— 网关和 GPT 网页根本不知道中间发生过压缩。</text>
</svg>
