# US egress proxy for one kiro slot (10-28). mihomo pinned to ONE iGuge node, `US - 美国鲨鱼2 - 06`
# (exit 170.178.173.10), so the slot's IP never changes.
# 10-30: was a 5-node `fallback` group; 3 of its backups (圣何塞-04 / 洛杉矶-02 / 洛杉矶-09) rotate exit IPs
# (30-min test 10-29), so a failover would have silently changed the slot's IP. Now: node down => slot down,
# disable it in Admin. Fixed-IP replacements with Kiro latency/speed measured 10-30: 西雅图-03 172.83.155.68
# (1.35s, 50Mbps), 美国-01 64.118.153.83 (1.54s, 42Mbps). Backup of the old config: 198 ~/kiro-us-egress/*.pre-pin-*.
# Config + node credentials + proxy password live in Secret kiro-us-egress (generated on 198 under
# ~/kiro-us-egress/, not in git). Only kiro-rs-slots pods can reach it (NetworkPolicy), and it needs
# user `kiro` + password even then. The slot in Admin: http://kiro-us-egress.kiro-rs.svc:7890.
# Roll back: disable the slot in Admin (users move on their next request), then delete this file's objects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiro-us-egress
  namespace: kiro-rs
  labels: {app: kiro-us-egress}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app: kiro-us-egress}
  template:
    metadata:
      labels: {app: kiro-us-egress}
    spec:
      nodeSelector: {kubernetes.io/hostname: aiyjy-litellm-242}
      tolerations: [{key: dedicated, operator: Equal, value: new-node, effect: NoSchedule}]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
      containers:
        - name: mihomo
          image: 127.0.0.1:5000/mihomo:v1.19.33-carher1
          imagePullPolicy: IfNotPresent
          args: ["-d", "/work", "-f", "/cfg/config.yaml"]
          ports: [{name: proxy, containerPort: 7890}]
          readinessProbe: {tcpSocket: {port: 7890}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 7890}, periodSeconds: 20, failureThreshold: 3}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: cfg, mountPath: /cfg, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: cfg
          secret: {secretName: kiro-us-egress, defaultMode: 0440}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kiro-us-egress
  namespace: kiro-rs
spec:
  type: ClusterIP
  selector: {app: kiro-us-egress}
  ports: [{name: proxy, port: 7890, targetPort: 7890}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiro-us-egress-ingress
  namespace: kiro-rs
spec:
  podSelector: {matchLabels: {app: kiro-us-egress}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: kiro-rs-slots}}
        - podSelector: {matchLabels: {kiro-us-egress-probe: "1"}}
      ports: [{port: 7890, protocol: TCP}]
