# Example only. Copy the live nginx configuration into a root-only file,
# preserve every unrelated server/upstream, then add these two markers once.
http {
    upstream litellm_product { server 127.0.0.1:30402; keepalive 32; }

    # @@LITELLM_GRAY_HTTP_DIRECTIVES@@

    server {
        listen 443 ssl;

        location ^~ /pro/ui/ {
            rewrite ^/pro/(.*)$ /$1 break;
            # @@LITELLM_GRAY_PRODUCT_PROXY_DIRECTIVES@@
        }

        location /pro/ {
            rewrite ^/pro/(.*)$ /$1 break;
            # @@LITELLM_GRAY_PRODUCT_PROXY_DIRECTIVES@@
        }
    }
}
