<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2329">16 轮真实会话：原始一路涨，出网恒定不动</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#8f959e">模型 cursor-web-fc-82-terra，每轮字节数为实测值</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="300" x2="740" y2="300" stroke="#c9cdd4" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="60" stroke="#c9cdd4" stroke-width="1.5"/>

  <!-- y 轴刻度 -->
  <line x1="80" y1="243.5" x2="740" y2="243.5" stroke="#eff0f1"/>
  <line x1="80" y1="187.0" x2="740" y2="187.0" stroke="#eff0f1"/>
  <line x1="80" y1="130.4" x2="740" y2="130.4" stroke="#eff0f1"/>
  <line x1="80" y1="73.9"  x2="740" y2="73.9"  stroke="#eff0f1"/>
  <text x="72" y="304" text-anchor="end" font-size="11" fill="#8f959e">0</text>
  <text x="72" y="247" text-anchor="end" font-size="11" fill="#8f959e">0.5MB</text>
  <text x="72" y="191" text-anchor="end" font-size="11" fill="#8f959e">1.0MB</text>
  <text x="72" y="134" text-anchor="end" font-size="11" fill="#8f959e">1.5MB</text>
  <text x="72" y="78"  text-anchor="end" font-size="11" fill="#8f959e">2.0MB</text>

  <!-- x 轴刻度 -->
  <text x="80"  y="320" text-anchor="middle" font-size="11" fill="#8f959e">1</text>
  <text x="293" y="320" text-anchor="middle" font-size="11" fill="#8f959e">6</text>
  <text x="506" y="320" text-anchor="middle" font-size="11" fill="#8f959e">11</text>
  <text x="720" y="320" text-anchor="middle" font-size="11" fill="#8f959e">16</text>
  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#4e5969">轮次</text>

  <!-- 原始体积（Cursor 每轮重发的全量） -->
  <polyline fill="none" stroke="#f53f3f" stroke-width="2.5"
    points="80,258.3 122.7,244.3 165.3,230.4 208,216.5 250.7,202.6 293.3,188.6 336,174.7 378.7,160.8 421.3,146.9 464,133.0 506.7,119.1 549.3,105.1 592,91.2 634.7,77.3 677.3,63.4 720,49.4"/>
  <circle cx="80" cy="258.3" r="3" fill="#f53f3f"/>
  <circle cx="720" cy="49.4" r="4" fill="#f53f3f"/>
  <text x="716" y="40" text-anchor="end" font-size="12" font-weight="bold" fill="#f53f3f">2,216,366 B</text>
  <text x="200" y="278" font-size="11" fill="#8f959e">两条线起点重合：首轮必须发全量 369,358 B</text>

  <!-- 实际出网（跨公网上行） -->
  <polyline fill="none" stroke="#00b42a" stroke-width="2.5"
    points="80,258.2 122.7,286.0 165.3,286.0 208,286.0 250.7,286.0 293.3,286.0 336,286.0 378.7,286.0 421.3,286.0 464,286.0 506.7,286.0 549.3,286.0 592,286.0 634.7,286.0 677.3,286.0 720,286.0"/>
  <circle cx="80" cy="258.2" r="3" fill="#00b42a"/>
  <circle cx="720" cy="286.0" r="4" fill="#00b42a"/>
  <text x="716" y="278" text-anchor="end" font-size="12" font-weight="bold" fill="#00934a">123,459 B</text>

  <!-- 差距标注 -->
  <line x1="756" y1="49.4" x2="756" y2="286.0" stroke="#ff9a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="766" y="160" font-size="12" font-weight="bold" fill="#ff7d00">省掉</text>
  <text x="766" y="178" font-size="12" font-weight="bold" fill="#ff7d00">94.4%</text>

  <!-- 图例 -->
  <line x1="100" y1="366" x2="132" y2="366" stroke="#f53f3f" stroke-width="2.5"/>
  <text x="140" y="370" font-size="12.5" fill="#4e5969">原始体积（Cursor 每轮重发的全量，也是上游实际收到的）</text>
  <line x1="100" y1="392" x2="132" y2="392" stroke="#00b42a" stroke-width="2.5"/>
  <text x="140" y="396" font-size="12.5" fill="#4e5969">实际跨公网上行（首轮必须发全量，之后恒定 ~123,455 B）</text>

  <text x="740" y="370" text-anchor="end" font-size="12.5" font-weight="bold" fill="#1f2329">累计 19.73MB → 2.12MB</text>
  <text x="740" y="392" text-anchor="end" font-size="12.5" font-weight="bold" fill="#00934a">整体省 89.3%</text>
</svg>
