[Service]
# 鉴权翻译：实例用自己已有的 CARHER_PROD_KEY 当门票（存 sha256），
# shim 换成 /etc/xai-vidshim/upstream.key 里的 sub2api key 打上游。
# 这样不必给 her 容器发新 env var，也就不必重建容器。
Environment=VIDSHIM_UPSTREAM_KEY_FILE=/etc/xai-vidshim/upstream.key
Environment=VIDSHIM_ALLOWED_SHA256=<每个实例 CARHER_PROD_KEY 的 sha256，逗号分隔>
# 线上实际有 3 条（13/14/75）。此处不入库真值：sha256 虽不可逆，但它是生产凭据的
# 验证器，拿到它可以校验猜中的 key。取值：
#   docker exec <容器> sh -lc 'printf %s "$CARHER_PROD_KEY" | sha256sum'
# 需要读 /etc/xai-vidshim/，DynamicUser 下 ProtectSystem=strict 仍可读，但 key 是 0640 root:root
DynamicUser=no
User=root
PrivateTmp=no
