{{- include "litellm-proxy.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm-proxy.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
immutable: true
data:
  {{- toYaml .Values.config.data | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm-proxy.callbacksName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
immutable: true
data:
  {{- toYaml .Values.callbacks.data | nindent 2 }}
{{- range .Values.additionalSnapshots }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm-proxy.snapshotName" (dict "root" $ "snapshot" .) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "litellm-proxy.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
immutable: true
data:
  {{- toYaml .data | nindent 2 }}
{{- end }}
