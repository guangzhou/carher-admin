# myai（ai_token_dashboard）的唯一入口：https://chat.auto-link.com.cn/myai/
# 跑在 243 单节点 k3s，ns ai-token-dashboard。myai.carher.net 那份（deploy/ai-token-dashboard + cloudflared）2026-10-29 已缩到 0。
#
# 为什么是第二个 Deployment，而不是给原来那份多加一个域名（读 2818c0d 源码确认）:
#   - enforce_csrf 拿 Origin 和 APP_BASE_URL 严格比 scheme+netloc ⇒ 一个进程只认一个域名
#   - sso_start 的 redirect_uri = APP_BASE_URL + /api/auth/callback
# 同镜像、同 ConfigMap/Secret、同库、同 app-data PVC（auth.sqlite3 是 WAL + busy_timeout，同节点已有 3 个 pod 共用）。
# 只覆盖 APP_BASE_URL（10-29 起共享 CM/Secret 里也是这个值，留着防有人改回）。
# 后台预取（ADMIN_LIVE_TOTALS_PREFETCH）原本由主看板跑、这里关掉；主看板下线后由这份跑，所以不再覆盖。
#
# 前面是 198 nginx（chat.auto-link.com.cn.conf 里 `# >>> myai-subpath >>>` 那一段），转发到下面的 NodePort。
# 部署/回滚走 scripts/myai-chat-subpath/deploy.sh；SOP 见 skill cli-anything-myai §入口。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-token-dashboard-chat
  namespace: ai-token-dashboard
  labels: {app: ai-token-dashboard-chat}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-token-dashboard-chat}
  template:
    metadata:
      labels: {app: ai-token-dashboard-chat}
    spec:
      containers:
      - name: dashboard
        # 🔴 镜像以线上为准，发布走 scripts/myai-release.sh（会 set image）。这里写的是 perf-3994a87，
        # 写成 :latest 会在 apply 时把它打回 10-10 的老版本（无补丁 0003~0018）。
        image: ai-token-dashboard:perf-3994a87
        imagePullPolicy: Never
        envFrom:
        - configMapRef: {name: dashboard-config}
        - secretRef: {name: dashboard-secrets}
        # env 优先级高于 envFrom ⇒ 这里的值会盖过 Secret 里的 APP_BASE_URL
        env:
        - {name: APP_BASE_URL, value: "https://chat.auto-link.com.cn/myai"}
        - {name: USAGE_SYNC_ROLE, value: reader}
        - {name: USAGE_DB_POOL_MIN_SIZE, value: "1"}
        - {name: USAGE_DB_POOL_MAX_SIZE, value: "5"}
        - {name: USAGE_REDIS_URL, value: "redis://usage-redis:6379/0"}
        ports:
        - {containerPort: 8000, name: http}
        readinessProbe:
          httpGet: {path: /api/health, port: http}
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /api/health, port: http}
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "2", memory: 2Gi}
        volumeMounts:
        - {mountPath: /app/.data, name: app-data}
      volumes:
      - name: app-data
        persistentVolumeClaim: {claimName: app-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-token-dashboard-chat
  namespace: ai-token-dashboard
spec:
  type: NodePort
  selector: {app: ai-token-dashboard-chat}
  ports:
  - {name: http, port: 8000, targetPort: http, nodePort: 30810}
