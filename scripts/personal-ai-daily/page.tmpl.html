<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 AI 用量</title>
<style>
/* 个人 / 团队 AI 用量页。与「AI 用量总账」同一套配色和交互习惯（hover 看数、时间窗切换、点人下钻），
   但只装本人（或本人团队）的数据。零外链：飞书文件预览里外链和下载都被沙箱拦，页内 JS/SVG 正常。 */
:root{
  --bg:#f6f7f4; --panel:#fff; --ink:#1b1f1d; --muted:#5f6a64; --rule:#e1e5df;
  --accent:#1f6f5c; --accent-2:#c2832e; --soft:#e3efe9; --ext:#7a5aa8; --weekend:#9cc3b5;
  --body:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Noto Sans Mono CJK SC",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1c; --ink:#e7ece8; --muted:#9aa59f; --rule:#2c332f;
  --accent:#4fb393; --accent-2:#e0a554; --soft:#1f2e28; --ext:#a98bd6; --weekend:#3c6a5c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 顶部：人和数是主角，日期只是一行小字 */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.who{font-size:26px;font-weight:700;letter-spacing:.01em}
.who small{font-size:14px;font-weight:400;color:var(--muted);margin-left:10px}
.asof{font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr);gap:18px;align-items:center}
.big{font-family:var(--mono);font-size:clamp(40px,7vw,58px);font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.big-k{font-size:13px;color:var(--muted);margin-bottom:6px}
.big-s{font-size:14px;color:var(--muted);margin-top:8px}
.up{color:var(--accent)} .down{color:var(--accent-2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:500} .kpi .s{font-size:12px;color:var(--muted)}

/* 控件 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{font-size:17px;margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--panel);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap;flex:0 0 auto}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}

/* 柱状图 */
.chart{position:relative;height:220px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.ax{fill:var(--muted);font-family:var(--mono);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.08);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 工具构成 */
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.mix i{display:block;height:100%}
.mixl{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}
.mixl i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* 位置 */
.pos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pos .v{font-size:26px;font-weight:500;color:var(--accent)}
.pos .v span{font-size:14px;color:var(--muted);margin-left:3px}

/* 团队成员表 */
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto}
.tblwrap{overflow-x:auto;margin:0 -4px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none;white-space:nowrap}
th.r,td.r{text-align:right}
th[aria-sort]::after{content:" ↓";color:var(--accent)}
td{padding:8px;border-bottom:1px solid var(--rule)}
tr.row{cursor:pointer} tr.row:hover td{background:var(--bg)}
tr.me td:first-child{font-weight:700}
.tag{display:inline-block;font-size:11px;border:1px solid currentColor;border-radius:9px;padding:0 6px;margin-left:6px;color:var(--accent-2)}
.idle{color:var(--muted)}
.spark{width:96px;height:22px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:var(--bg);border-radius:999px;padding:2px 10px}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .kpis,.pos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:20px}
  .hide-sm{display:none}
  .panel{padding:14px 14px}
  .bar{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="who" id="who"></div>
    <div class="asof" id="asof"></div>
  </div>

  <div class="panel hero">
    <div><div class="big-k" id="bigK"></div><div class="big" id="big"></div><div class="big-s" id="bigS"></div></div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="panel">
    <div class="bar"><h2 id="trendTitle"></h2>
      <div class="seg" id="winSeg">
        <button data-w="30" aria-pressed="true">30 天</button><button data-w="90">90 天</button><button data-w="all">全部</button>
      </div></div>
    <div class="chart" id="trend"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>工作日</span><span><i style="background:var(--weekend)"></i>周末</span><span><i style="background:var(--accent-2)"></i>昨天</span><span class="hide-sm">悬停看每天的数</span></div>
  </div>

  <div class="panel" id="teamPanel" hidden>
    <div class="bar"><h2>成员</h2>
      <div class="seg" id="colSeg">
        <button data-c="y" aria-pressed="true">昨天</button><button data-c="d7">近 7 天</button><button data-c="d30">近 30 天</button><button data-c="t">累计</button>
      </div></div>
    <div class="tblwrap"><table id="tbl"><thead><tr><th data-k="n">姓名</th><th data-k="v" class="r" aria-sort="descending">用量</th><th class="hide-sm">近 30 天</th><th data-k="act" class="r hide-sm">活跃天</th><th class="hide-sm">工具</th></tr></thead><tbody></tbody></table></div>
    <div class="muted" style="font-size:13px;margin-top:8px">点成员看他的走势 · 点表头排序</div>
  </div>

  <div class="panel" id="idlePanel" hidden>
    <div class="bar"><h2>近 30 天没用过</h2><span class="muted" id="idleN"></span></div>
    <div class="chips" id="idle"></div>
    <div class="muted" style="font-size:13px;margin-top:8px" id="ambNote"></div>
  </div>

  <div class="panel">
    <div class="bar"><h2>工具构成</h2><span class="muted" style="font-size:13px">累计</span></div>
    <div id="mix"></div>
  </div>

  <div class="panel" id="posPanel">
    <div class="bar"><h2>和大家比</h2><span class="muted" style="font-size:13px">只给位置和全员人均，不出现任何其他人</span></div>
    <div class="pos" id="pos"></div>
  </div>

  <div class="foot"><span>金额按模型公开价折算，用来看用量多少，不是实际付款</span><span id="footR"></span></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtK = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : v >= 1e4 ? "$" + (v / 1e3).toFixed(1) + "k" : v >= 1e3 ? "$" + (v / 1e3).toFixed(2) + "k" : v >= 10 ? "$" + Math.round(v) : "$" + v.toFixed(1);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const D = DATA.dates, ME = DATA.me, TEAM = DATA.team || [], CO = DATA.co;
const WEEK = "日一二三四五六";
const sum = a => a.reduce((x, y) => x + y, 0);
const sign = x => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(0) + "%";
const dow = d => new Date(d + "T00:00:00+08:00").getDay();
const state = { win: "30", col: "y", sort: "v", focus: null };

const isLeader = TEAM.length > 0;
const ALL = isLeader ? [ME, ...TEAM] : [ME];
const teamS = D.map((_, i) => sum(ALL.map(p => p.s[i])));
const actDays = p => p.s.slice(-30).filter(v => v > 0).length;
const val = (p, c) => c === "y" ? p.y : c === "t" ? p.t : sum(p.s.slice(c === "d7" ? -7 : -30));

// ---------- 顶部
$("#who").innerHTML = isLeader ? `${esc(ME.n)} 的团队<small>${ALL.length + DATA.idleExtra.length + DATA.ambiguous.length} 人</small>` : `${esc(ME.n)}<small>${esc(ME.dept)}</small>`;
$("#asof").textContent = `数据截至 ${D.at(-1).slice(5).replace("-", "/")}（周${WEEK[dow(D.at(-1))]}）· 每天早上更新`;
document.title = isLeader ? `${ME.n} 的团队 · AI 用量` : `${ME.n} · AI 用量`;

function drawHero() {
  const S = isLeader ? teamS : ME.s, n = S.length, y = isLeader ? sum(ALL.map(p => p.y)) : ME.y;
  const lastWd = S[n - 8] || 0, wk = sum(S.slice(-7)) / 7, pw = sum(S.slice(-14, -7)) / 7;
  $("#bigK").textContent = isLeader ? "团队昨天" : "我昨天";
  $("#big").textContent = fmtK(y);
  const d = lastWd ? y / lastWd - 1 : null;
  $("#bigS").innerHTML = lastWd ? `比上周同一天 <span class="${d >= 0 ? "up" : "down"}">${sign(d)}</span>（${fmtK(lastWd)}）` : "上周同一天没有用量";
  const k = isLeader ? [
    ["昨天在用", `${ALL.filter(p => p.y > 0).length}<span class="muted" style="font-size:14px"> / ${ALL.length} 人</span>`, "含你自己"],
    ["近 7 天日均", fmtK(wk), pw ? `前 7 天 ${fmtK(pw)} · ${sign(wk / pw - 1)}` : ""],
    ["我昨天", fmtK(ME.y), `近 30 天 ${fmtK(sum(ME.s.slice(-30)))}`],
  ] : [
    ["近 7 天日均", fmtK(wk), pw ? `前 7 天 ${fmtK(pw)} · ${sign(wk / pw - 1)}` : ""],
    ["近 30 天", fmtK(sum(S.slice(-30))), `用了 ${actDays(ME)} 天`],
    ["累计", fmtK(ME.t), ME.first ? `自 ${ME.first.slice(5).replace("-", "/")} 起` : ""],
  ];
  $("#kpis").innerHTML = k.map(([a, b, c]) => `<div class="kpi"><div class="k">${a}</div><div class="v num">${b}</div><div class="s">${c}</div></div>`).join("");
}

// ---------- 走势（hover 看数，切时间窗，团队里点人切到个人）
function drawTrend() {
  const who = state.focus;
  const S = who ? who.s : (isLeader ? teamS : ME.s);
  const n = state.win === "all" ? S.length : Math.min(+state.win, S.length);
  const v = S.slice(-n), DD = D.slice(-n);
  $("#trendTitle").innerHTML = who ? `${esc(who.n)} 的每日用量 <button class="seg" id="backTeam" style="padding:2px 10px;font-size:12px;cursor:pointer">回到团队</button>` : (isLeader ? "团队每日用量" : "我的每日用量");
  $("#backTeam")?.addEventListener("click", () => { state.focus = null; drawTrend(); });
  const el = $("#trend"), W = el.clientWidth || 800, H = 220, pad = { l: 52, r: 8, t: 14, b: 24 };
  const mx = Math.max(...v, 1) * 1.12, bw = (W - pad.l - pad.r) / n;
  const y = x => pad.t + (H - pad.t - pad.b) * (1 - x / mx);
  let g = "";
  for (let k = 0; k < 4; k++) { const gv = mx / 1.12 * k / 3; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(gv)}" y2="${y(gv)}" stroke="${css("--rule")}"/><text x="${pad.l - 6}" y="${y(gv) + 4}" text-anchor="end" class="ax">${fmtK(gv)}</text>`; }
  const step = n > 120 ? 30 : n > 45 ? 14 : 7;
  v.forEach((x, i) => {
    const last = i === n - 1, wk = [0, 6].includes(dow(DD[i]));
    const col = last ? css("--accent-2") : wk ? css("--weekend") : css("--accent");
    g += `<rect x="${pad.l + i * bw + bw * .14}" y="${y(x)}" width="${Math.max(1, bw * .72)}" height="${Math.max(x > 0 ? 1 : 0, H - pad.b - y(x))}" rx="${bw > 6 ? 2 : 0}" fill="${col}"/>`;
    if ((n - 1 - i) % step === 0) g += `<text x="${pad.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" class="ax">${+DD[i].slice(5, 7)}/${+DD[i].slice(8)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}<rect class="hit" x="${pad.l}" y="0" width="${W - pad.l - pad.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) / r.width * W - pad.l) / bw)));
    tip.innerHTML = `<div class="muted num">${DD[i]}（周${WEEK[dow(DD[i])]}）</div><b class="num">${fmtK(v[i])}</b>`;
    tip.hidden = false;
    const tx = (pad.l + i * bw) / W * r.width;
    tip.style.left = Math.min(tx + 10, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = "4px";
  });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}

// ---------- 团队成员表
const spark = s => {
  const v = s.slice(-30), mx = Math.max(...v, 1);
  return `<svg class="spark" viewBox="0 0 96 22" preserveAspectRatio="none">${v.map((x, i) => `<rect x="${i * 3.2}" y="${22 - 22 * x / mx}" width="2.4" height="${22 * x / mx}" fill="${x > 0 ? css("--accent") : "transparent"}"/>`).join("")}</svg>`;
};
function drawTable() {
  if (!isLeader) return;
  $("#teamPanel").hidden = false;
  const rows = ALL.map(p => ({ p, v: val(p, state.col), act: actDays(p) }));
  rows.sort((a, b) => state.sort === "n" ? a.p.n.localeCompare(b.p.n, "zh") : state.sort === "act" ? b.act - a.act : b.v - a.v);
  $("#tbl tbody").innerHTML = rows.map(({ p, v, act }) => `<tr class="row${p === ME ? " me" : ""}" data-n="${esc(p.n)}">
    <td>${esc(p.n)}${p === ME ? '<span class="tag">我</span>' : ""}</td>
    <td class="r num${v ? "" : " idle"}">${v ? fmtK(v) : "未使用"}</td>
    <td class="hide-sm">${spark(p.s)}</td>
    <td class="r num hide-sm">${act}</td>
    <td class="hide-sm muted" style="font-size:12px">${esc(Object.keys(p.ty).join(" · "))}</td></tr>`).join("");
  $("#tbl thead").querySelectorAll("th[data-k]").forEach(th => th.toggleAttribute("aria-sort", th.dataset.k === state.sort));
  $("#tbl tbody").querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", () => {
    state.focus = ALL.find(p => p.n === tr.dataset.n); drawTrend(); $("#trend").scrollIntoView({ behavior: "smooth", block: "center" });
  }));
}
function drawIdle() {
  if (!isLeader) return;
  const idle = [...TEAM.filter(p => sum(p.s.slice(-30)) <= 0).map(p => p.n), ...DATA.idleExtra];
  $("#idlePanel").hidden = false;
  $("#idleN").textContent = `${idle.length} 人`;
  $("#idle").innerHTML = idle.length ? idle.map(n => `<span class="chip">${esc(n)}</span>`).join("") : `<span style="color:var(--accent)">全员近 30 天都用过</span>`;
  $("#ambNote").textContent = DATA.ambiguous.length ? `另有 ${DATA.ambiguous.length} 人同名，暂时认不出是哪一位，没计入：${DATA.ambiguous.join("、")}` : "";
}

// ---------- 工具构成
const TOOLS = [["Cursor", "--accent"], ["Claude Code", "--accent-2"], ["Her", "--ext"]];
function drawMix() {
  const tot = {};
  // 总账只存每人累计的工具拆分，没有按天的 ⇒ 这里只能给累计，不做「近 30 天」切换（不编数）
  for (const [k] of TOOLS) tot[k] = sum(ALL.map(p => p.ty[k] || 0));
  const all = sum(Object.values(tot)) || 1;
  $("#mix").innerHTML = `<div class="mix">${TOOLS.filter(([k]) => tot[k]).map(([k, c]) => `<i style="width:${100 * tot[k] / all}%;background:var(${c})"></i>`).join("")}</div>
    <div class="mixl">${TOOLS.filter(([k]) => tot[k]).map(([k, c]) => `<span><i style="background:var(${c})"></i>${k} <b class="num">${(100 * tot[k] / all).toFixed(0)}%</b> <span class="muted num">${fmtK(tot[k])}</span></span>`).join("")}</div>`;
}

// ---------- 位置（只给位置和人均）
function drawPos() {
  if (isLeader) { $("#posPanel").hidden = true; return; }
  const p = [
    ["近 30 天用量位置", ME.pct ? `前 ${ME.pct}<span>%</span>` : "—", `在 ${CO.d30n} 位近 30 天用过的同事里`],
    ["昨天 vs 全员人均", CO.yavg && ME.y ? `${(ME.y / CO.yavg).toFixed(1)}<span>倍</span>` : "—", `全员昨天人均 ${fmtK(CO.yavg)}，${CO.yn} 人在用`],
    ["近 30 天活跃", `${actDays(ME)}<span>/ 30 天</span>`, "当天用过就算一天"],
  ];
  $("#pos").innerHTML = p.map(([a, b, c]) => `<div class="kpi"><div class="k">${a}</div><div class="v num">${b}</div><div class="s">${c}</div></div>`).join("");
}
$("#footR").textContent = isLeader ? "只有你（团队 leader）能看到这份" : "只有你本人能看到这份";

// ---------- 控件
const bindSeg = (id, key, attr, redraw) => $(id).querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  state[key] = b.dataset[attr]; $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); redraw();
}));
bindSeg("#winSeg", "win", "w", drawTrend);
bindSeg("#colSeg", "col", "c", drawTable);
document.querySelectorAll("#tbl th[data-k]").forEach(th => th.addEventListener("click", () => { state.sort = th.dataset.k; drawTable(); }));
addEventListener("resize", () => drawTrend());

drawHero(); drawTrend(); drawTable(); drawIdle(); drawMix(); drawPos();
</script>
</body>
</html>
